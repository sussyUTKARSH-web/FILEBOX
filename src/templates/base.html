<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FileBox{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='filebox.css', v='edit-lock-1') }}">
  <script defer src="{{ url_for('static', filename='filebox.js', v='edit-lock-1') }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="toast-stack" aria-live="polite">
      {% for category, message in messages %}<div class="toast toast-{{ category }}">{{ message }}</div>{% endfor %}
    </div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
